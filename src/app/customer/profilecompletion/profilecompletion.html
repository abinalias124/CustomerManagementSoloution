
<div class="container py-4">
  <div class="card shadow-lg border-0 rounded-4 p-4">
    <h4 class="fw-bold text-primary mb-3 text-center">Complete Your Profile</h4>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="row g-3">

        <!-- Full Name -->
        <div class="col-md-6">
          <div class="form-floating">
            <input type="text" class="form-control" formControlName="fullName" placeholder="Full Name">
            <label>Full Name</label>
          </div>
          <div *ngIf="profileForm.get('fullName')?.touched && profileForm.get('fullName')?.invalid"
               class="text-danger small">
            Full name is required (max 150 chars).
          </div>
        </div>

        <!-- Date of Birth -->
        <div class="col-md-6">
          <div class="form-floating">
            <input type="date"
                   class="form-control"
                   formControlName="dateOfBirth"
                   placeholder="Date of Birth"
                   [max]="today">
            <label>Date of Birth</label>
          </div>
          <div *ngIf="profileForm.get('dateOfBirth')?.touched && profileForm.get('dateOfBirth')?.invalid"
               class="text-danger small">
            <div *ngIf="profileForm.get('dateOfBirth')?.errors?.['required']">
              Date of Birth is required.
            </div>
          </div>
        </div>

        <!-- Gender -->
        <div class="col-md-6">
          <label class="fw-bold mb-1 small">Gender</label>
          <div class="d-flex gap-3">
            <div class="form-check form-check-inline small">
              <input type="radio" class="form-check-input" id="genderMale" [value]="'Male'" formControlName="gender">
              <label class="form-check-label" for="genderMale">Male</label>
            </div>
            <div class="form-check form-check-inline small">
              <input type="radio" class="form-check-input" id="genderFemale" [value]="'Female'" formControlName="gender">
              <label class="form-check-label" for="genderFemale">Female</label>
            </div>
            <div class="form-check form-check-inline small">
              <input type="radio" class="form-check-input" id="genderOther" [value]="'Other'" formControlName="gender">
              <label class="form-check-label" for="genderOther">Other</label>
            </div>
          </div>
        </div>

        <!-- Phone Number -->
        <div class="col-md-6">
          <div class="form-floating">
            <input type="text"
                   class="form-control"
                   formControlName="phoneNumber"
                   placeholder="Phone Number"
                   maxlength="10">
                
            <label>Phone Number</label>
          </div>
          <div *ngIf="profileForm.get('phoneNumber')?.touched && profileForm.get('phoneNumber')?.invalid"
               class="text-danger small mt-1">
            <div *ngIf="profileForm.get('phoneNumber')?.errors?.['required']">Phone number is required</div>
            <div *ngIf="profileForm.get('phoneNumber')?.errors?.['pattern']">Invalid Indian phone number</div>
          </div>
        </div>

        <!-- Address -->
        <div class="col-md-12">
          <div class="form-floating">
            <textarea class="form-control" formControlName="address" placeholder="Address" style="height:100px"></textarea>
            <label>Address</label>
          </div>
          <div *ngIf="profileForm.get('address')?.touched && profileForm.get('address')?.invalid"
               class="text-danger small">
            Address is required (max 300 chars).
          </div>
        </div>

        <!-- Pincode -->
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text"
                   class="form-control"
                   formControlName="pincode"
                   placeholder="Pincode"
                   maxlength="6"
                   (input)="onPincodeChange($event.target.value)">
                  
            <label>Pincode</label>
          </div>
          <div *ngIf="profileForm.get('pincode')?.touched && profileForm.get('pincode')?.invalid"
               class="text-danger small mt-1">
            <div *ngIf="profileForm.get('pincode')?.errors?.['required']">Pincode is required</div>
            <div *ngIf="profileForm.get('pincode')?.errors?.['pattern']">Pincode must be 6 digits</div>
            <div *ngIf="profileForm.get('pincode')?.errors?.['notFound']">Pincode not found</div>
          </div>
        </div>

        <!-- State -->
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text" class="form-control" formControlName="stateName" placeholder="State" readonly>
            <label>State</label>
          </div>
        </div>

        <!-- District -->
        <div class="col-md-4">
          <div class="form-floating">
            <input type="text" class="form-control" formControlName="districtName" placeholder="District" readonly>
            <label>District</label>
          </div>
        </div>

        <!-- Post Office -->
        <div class="col-md-6">
          <div class="form-floating">
            <select class="form-select" formControlName="postOfficeId">
              <option value="">Select</option>
              <option *ngFor="let po of postOffices" [value]="po.Id">{{ po.Name }}</option>
            </select>
            <label>Post Office</label>
          </div>
          <div *ngIf="profileForm.get('postOfficeId')?.touched && profileForm.get('postOfficeId')?.invalid"
               class="text-danger small">
            Post Office is required.
          </div>
        </div>

      </div>
      <!-- Save Button -->
      <div class="text-end mt-4">
        <button type="submit" class="btn btn-primary btn-sm px-4 rounded-pill p-2 shadow-sm" [disabled]="loading">
          <i class="bi" [ngClass]="loading ? 'bi-hourglass-split' : 'bi-check-circle'"></i>
          {{ isEditMode ? (loading ? 'Updating...' : 'Update Profile') : (loading ? 'Saving...' : 'Save & Continue') }}
        </button>
      </div>
    </form>
  </div>
</div>
