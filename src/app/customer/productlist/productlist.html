<div class="container mt-4"
     style="height: 600px; overflow-y: auto;"
     infiniteScroll
     [infiniteScrollDistance]="2"
     [infiniteScrollThrottle]="150"
     [scrollWindow]="false"
     (scrolled)="onScroll()">

  <h2 class="mb-4">Available Products</h2>

  <!-- Search Bar -->
  <div class="mb-4">
    <div class="input-group search-bar shadow-sm rounded-pill overflow-hidden">
      <input type="text"
             class="form-control border-0"
             placeholder="Search products..."
             [(ngModel)]="searchText">
      <span class="input-group-text bg-primary text-white border-0">
        <i class="bi bi-search"></i>
      </span>
    </div>
  </div>

  <!-- No products -->
  @if (filteredProducts.length === 0 && !loading) {
    <div class="text-center text-muted">
      No products available
    </div>
  }

  <!-- Product Cards Grid -->
  <div class="row g-3">
    @for (product of filteredProducts; track product) {
      <div class="col-lg-3 col-md-4 col-sm-6">
        <div class="card product-card shadow-sm border-0 rounded-3 h-100 position-relative">
  
          <!-- Product Image + Overlay -->
          <div class="p-3 image-container" [class.out-of-stock]="product.Stock === 0 || product.stock === 0">
            <img [src]="product.ImageUrl || 'assets/no-image.png'"
                 alt="Product"
                 class="card-img-top rounded-3 product-img">
  
            <!-- Out of Stock Overlay -->
            <div *ngIf="product.Stock === 0 || product.stock === 0" class="overlay">
              Out of Stock
            </div>
          </div>
  
          <!-- Product Details -->
          <div class="card-body text-center p-3">
            <h6 class="card-title fw-bold text-dark mb-1">{{ product.Name }}</h6>
            <p class="card-text text-muted small mb-2">{{ product.Description }}</p>
            <p class="fw-semibold text-success mb-2">
              {{ product.Price | currency:'INR' }}
            </p>
          </div>
  
          <!-- Card Footer -->
          <div class="card-footer bg-transparent border-0 text-center pb-3">
            <button class="btn btn-primary btn-sm"
                    (click)="addToCart(product.ProductId)"
                    [disabled]="product.Stock === 0 || product.stock === 0">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    }
  </div>
  

  <!-- Loading Spinner -->
  @if (loading) {
    <div class="text-center mt-3">
      <div class="spinner-border text-primary"></div>
    </div>
  }
</div>
