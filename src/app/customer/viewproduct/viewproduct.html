<div class="container py-5">
  <h2 class="mb-4 text-center">🛒 My Cart</h2>

  <!-- Loading Spinner -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- Empty Cart -->
  <div *ngIf="!loading && cart.items.length === 0" class="alert alert-info text-center">
    Your cart is empty. <a routerLink="/products">Browse products</a>
  </div>

  <!-- Cart Items -->
  <div *ngIf="!loading && cart.items.length > 0" class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm mb-3" *ngFor="let item of cart.items">
        <div class="card-body d-flex align-items-center">

          <!-- Product Image -->
          <div class="me-3">
            <img [src]="item.imageUrl || 'assets/no-image.png'"
                 alt="{{ item.productName }}"
                 class="rounded"
                 style="width: 80px; height: 80px; object-fit: cover;">
          </div>

          <!-- Product Details -->
          <div class="flex-grow-1">
            <h5 class="mb-1">{{ item.productName }}</h5>
            <p class="mb-1 text-muted small">{{ item.description }}</p>
            <p class="mb-1 text-muted">Price: ₹{{ item.price }}</p>
            <p class="mb-1 text-muted">Subtotal: ₹{{ item.subtotal }}</p>
          </div>

          <!-- Quantity & Remove -->
         
          <div class="d-flex align-items-center">
            <!-- Minus -->
            <button class="btn btn-outline-secondary btn-sm" (click)="decreaseQuantity(item)">-</button>

          
            <!-- Quantity Display -->
            <span class="mx-2">{{ item.quantity }}</span>
          
           
<!-- Plus -->
<button 
  class="btn btn-outline-secondary btn-sm" 
  (click)="increaseQuantity(item)" 
  [disabled]="item.quantity >= item.stock">
  +
</button>

          
            <!-- Remove -->
            <button class="btn btn-outline-danger btn-sm ms-2" (click)="removeItem(item.cartItemId)">
              <i class="bi bi-trash"></i>
            </button>
          </div>
          

        </div>
      </div>
    </div>

   
    <!-- Cart Summary -->
<div class="col-lg-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
      <h5 class="card-title text-center mb-4"> Cart Summary</h5>

      <!-- List of items -->
      <div *ngFor="let item of cart.items" class="d-flex align-items-center mb-3">
        <img [src]="item.imageUrl || 'assets/no-image.png'" alt="{{item.productName}}"
             class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
        <div class="flex-grow-1">
          <h6 class="mb-1">{{ item.productName }}</h6>
          <small class="text-muted">Qty: {{ item.quantity }}</small>
        </div>
        <div>
          <strong>₹{{ item.subtotal }}</strong>
        </div>
      </div>

      <hr>

    
      <!-- Total Price -->
      <p class="d-flex justify-content-between fw-bold fs-5">
        <span>Total Price</span>
        <strong>₹{{ cart.total }}</strong>
      </p>

      <!-- Checkout Button -->
      <button class="btn btn-success w-100 mt-3 shadow-sm" style="font-weight: 600; letter-spacing: 0.5px;" (click)=" proceedToCheckout()">
        Proceed to Checkout
      </button>
    </div>
  </div>
</div>

  </div>
</div>
